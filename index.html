<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Days of the Week</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="splash">
  <img src="assets/innovine-logo.png" alt="Innovine Solutions">
</div>

<div id="startScreen" class="screen">
  <div class="card">
    <img class="miniEngine" src="assets/engine.png" alt="Train">
    <h1>🚂 Days of the Week</h1>
    <p>Look at the train and find the missing day.</p>
    <p>Tap the correct answer.</p>
    <button id="startBtn" type="button">▶ Start Game</button>
  </div>
</div>

<div id="game" class="hidden">
  <header>
    <h1>Days of the Week</h1>
    <div class="topRow">
      <button id="hearBtn" type="button">🔊 Hear</button>
      <div id="progress">1 / 10</div>
      <div id="score">⭐ 0</div>
    </div>
  </header>

  <main>
    <section class="questionBox">
      <div class="trainWrap">
        <img class="engineImg" src="assets/engine.png" alt="Train engine">

        <!-- IMPORTANT: These are BLANK coach images.
             Day names are added only to the non-blank coaches by JavaScript. -->
        <div class="coachRow">
          <div class="coach">
            <img src="assets/coach-yellow-blank.png" alt="">
            <span id="coach1"></span>
          </div>

          <div class="coach">
            <img src="assets/coach-blue-blank.png" alt="">
            <span id="coach2"></span>
          </div>

          <div class="coach">
            <img src="assets/coach-red-blank.png" alt="">
            <span id="coach3"></span>
          </div>
        </div>
      </div>

      <p id="instruction"></p>
    </section>

    <p class="choose">Tap the missing day.</p>
    <div id="answers" class="answers"></div>

    <div id="feedback" class="hidden"></div>
    <div id="confetti"></div>
  </main>
</div>

<div id="endScreen" class="screen hidden">
  <div class="card">
    <div class="trophy">🏆</div>
    <h1>Great Job!</h1>
    <p id="finalScore"></p>
    <p>🎉 You know the days of the week!</p>
    <button id="againBtn" type="button">🔄 Play Again</button>
  </div>
</div>

<audio id="music" loop preload="auto">
  <source src="assets/background-music.mp3" type="audio/mpeg">
</audio>
<audio id="correctSound" preload="auto">
  <source src="assets/correct.mp3" type="audio/mpeg">
</audio>
<audio id="wrongSound" preload="auto">
  <source src="assets/wrong.mp3" type="audio/mpeg">
</audio>

<script src="speech.js"></script>
<script src="script.js"></script>
</body>
</html>
